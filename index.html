<!-- =====================================================================
     以下內嵌 <script>：本頁的核心程式
     涵蓋：資料載入、單字卡渲染、發音、循環朗讀、搜尋、抽考測驗
     ===================================================================== -->
<script>
// repeatStatus：記錄每個單字「重複朗讀」按鈕的開關狀態（key = 單字+語系）
const repeatStatus = {};
// container：所有單字卡的外層容器（對應上面的 #word-container）
const container = document.getElementById("word-container");

// 🎯 currentLoopingSection：記錄「目前正在循環朗讀」是哪一個區塊（沒有則為 null）
let currentLoopingSection = null;

// 🎯 播放速度設定：拖曳桿只停在這 5 種語速，預設 1.0（正常）
//    同時套用到「重複播放」與「循環播放」。
//    0.1x（最慢）、0.5x、1.0x（正常）、1.5x、2.0x（最快）。
const SPEED_STEPS = [0.1, 0.5, 1.0, 1.5, 2.0]; // 可選的實際語速（由慢到快）
let speechRate = 1.0; // 目前語速（預設正常）

// 取得實際要用的語速（夾在瀏覽器允許範圍 [0.1, 10] 內）
function getSpeechRate() {
    return Math.min(10, Math.max(0.1, speechRate));
}

// 依拖曳桿的格子索引設定語速，並把畫面上所有拖曳桿與數字同步
function setSpeechRateByIndex(idx) {
    speechRate = SPEED_STEPS[idx] ?? 1.0;
    document.querySelectorAll(".speed-slider").forEach(s => { s.value = String(idx); });
    document.querySelectorAll(".speed-value").forEach(l => { l.textContent = speechRate.toFixed(1) + "x"; });
}

// ========================= 音節自動拆解（可被單字檔的手動欄位覆蓋） =========================
// 注意：英文拼寫的自動切音節本來就不完全準（尤其相鄰母音、silent-e、不規則字），
//       之後可在單字 JSON 加 "sylWord" / "sylKK" 欄位（以 · 分隔）手動覆蓋正確拆法。

// KK 音節：以母音核心 + 重音記號（ˈ ˌ）切分
const KK_VOWELS = ['aɪ','aʊ','ɔɪ','ɝ','ɚ','ɪ','i','e','ɛ','æ','ə','ʌ','u','ʊ','o','ɔ','ɑ','a'];
function splitKK(kk){
  if(!kk) return [];
  const s = kk.replace(/[\[\]\/]/g,'').trim();
  const toks=[];
  for(let i=0;i<s.length;){
    let v=null;
    for(const vv of KK_VOWELS){ if(s.startsWith(vv,i)){ v=vv; break; } }
    if(v){ toks.push({t:v,vowel:true}); i+=v.length; }
    else { toks.push({t:s[i],vowel:false,stress:(s[i]==='ˈ'||s[i]==='ˌ')}); i++; }
  }
  const vIdx=[]; toks.forEach((t,i)=>{ if(t.vowel) vIdx.push(i); });
  if(vIdx.length<=1) return [toks.map(t=>t.t).join('')];
  const cuts=new Set();
  for(let k=1;k<vIdx.length;k++){
    const prevV=vIdx[k-1], curV=vIdx[k], between=curV-prevV-1;
    let cut;
    if(between<=0) cut=curV;
    else if(between===1) cut=curV-1;
    else cut=prevV+1+Math.floor(between/2);
    // 重音記號應作為「下一音節的起點」：若兩母音間有重音記號，切點設在它身上
    for(let j=prevV+1;j<curV;j++){ if(toks[j].stress){ cut=j; break; } }
    cuts.add(cut);
  }
  const parts=[]; let cur='';
  for(let i=0;i<toks.length;i++){ if(cuts.has(i)&&cur){ parts.push(cur); cur=''; } cur+=toks[i].t; }
  if(cur) parts.push(cur);
  return parts;
}

// 英文拼寫音節：母音群啟發式 + silent-e 處理
function splitWord(original){
  if(!original) return [];
  const w=original.toLowerCase();
  const isV=ch=>'aeiouy'.indexOf(ch)>=0;
  const n=w.length, runs=[];
  for(let i=0;i<n;i++){ const v=isV(w[i]); if(runs.length&&runs[runs.length-1].v===v) runs[runs.length-1].end=i+1; else runs.push({v,start:i,end:i+1}); }
  const vowelRuns=runs.filter(r=>r.v);
  let cuts=[];
  for(let r=0;r<runs.length;r++){
    if(runs[r].v) continue;
    const prevV=r>0&&runs[r-1].v, nextV=r<runs.length-1&&runs[r+1].v;
    if(prevV&&nextV){
      const nr=runs[r+1];
      // silent-e：字尾「子音+e」、且非唯一母音 → 不切（併入前一音節）
      const isFinalSilentE=(nr.end===n)&&(w.slice(nr.start,nr.end)==='e')&&(vowelRuns.length>=2);
      if(isFinalSilentE) continue;
      const len=runs[r].end-runs[r].start;
      cuts.push(len===1 ? runs[r].start : runs[r].start+1);
    }
  }
  // digraph 保護：不要把 sh/ch/th/ph/wh/gh/ck/ng/dg/tch 這些雙字母切開
  const DIGRAPHS=new Set(['sh','ch','th','ph','wh','gh','ck','ng','dg','tch']);
  cuts=cuts.map(c=>{
    let cut=c;
    for(let g=0; g<3 && cut>0; g++){
      if(DIGRAPHS.has(w.slice(cut-1,cut+1)) || DIGRAPHS.has(w.slice(cut-1,cut+2))) cut--; else break;
    }
    return cut;
  });
  cuts=[...new Set(cuts)].filter(c=>c>0&&c<n).sort((a,b)=>a-b);
  const parts=[]; let prev=0;
  for(const c of cuts){ if(c>prev){ parts.push(original.slice(prev,c)); prev=c; } }
  parts.push(original.slice(prev));
  return parts.filter(p=>p.length);
}

// 取得某單字要顯示的「拆解後單字」與「拆解後 KK」；優先用手動欄位
function getSyllableParts(item){
  const sylWord = item.sylWord ? item.sylWord : splitWord(item.word || "").join('·');
  const kkCore  = item.sylKK ? item.sylKK.replace(/[\[\]]/g,'') : splitKK(item.kk || "").join('·');
  return { sylWord, sylKK: kkCore };
}

// 🎯 重複次數：每張卡片要唸幾次（都不勾＝1 次；可選 2 或 3）。
//    對「只唸英文」模式＝英文唸幾次；對「英中循環」模式＝(英文+中文) 唸幾遍。
let repeatCount = 1;

// 目前的循環模式：'en'＝只唸英文；'en-cn'＝英文一遍中文一遍
let currentLoopMode = "en";

function getRepeatCount() { return repeatCount; }

// 使用者勾選/取消「2」或「3」時呼叫：更新次數並讓兩個選項互斥、全區塊同步
function onRepeatChange(cb) {
    const val = parseInt(cb.value, 10);
    repeatCount = cb.checked ? val : 1; // 勾了就用該值，取消就回到 1
    syncRepeatCheckboxes();
}

// 把所有區塊的重複次數勾選狀態同步成目前的 repeatCount（2 與 3 互斥）
function syncRepeatCheckboxes() {
    document.querySelectorAll(".repeat-cb").forEach(cb => {
        cb.checked = (parseInt(cb.value, 10) === repeatCount);
    });
}

// 初始化：先抓取 list.json 索引檔，再依序載入清單裡的每個單字檔
async function init() {
  container.innerHTML = "正在讀取索引檔...";

  try {
    // 讀取 word/list.json，取得要載入的檔案清單（陣列）
    const listResponse = await fetch("word/list.json?t=" + Date.now());
    if (!listResponse.ok) throw new Error("無法讀取 list.json 索引檔");

    const fileList = await listResponse.json();

    // 清空「載入中」提示文字
    container.innerHTML = "";

    // 依清單順序，一個一個載入單字檔（await 確保順序固定）
    for (const fileName of fileList) {
      await loadWordsFromFile(fileName);
    }

    // 清單為空時的提示
    if (fileList.length === 0) {
      container.innerHTML = "索引檔內沒有任何檔案。";
    }
  } catch (err) {
    // 任何錯誤（例如 list.json 不存在）都顯示在畫面上，方便除錯
    console.error(err);
    container.innerHTML = `<p style="color:red">初始化失敗：${err.message}</p>`;
  }
}

// 載入單一單字檔，並建立一個「可折疊的章節區塊」
async function loadWordsFromFile(fileName) {
  try {
    const response = await fetch(`word/${fileName}?t=` + Date.now());
    if (!response.ok) throw new Error(`找不到檔案: ${fileName}`);

    // 區塊標題 = 檔名去掉副檔名（例如「Word UP1.json」→「Word UP1」）
    const sectionTitleText = fileName.replace(/\.(txt|json)$/, "");
    const section = document.createElement("section");
    section.className = "section";

  // 建立區塊標題列（左邊文字、右邊循環播放按鈕，兩端對齊）
  const title = document.createElement("div");
  title.className = "section-title";
  // 用 flex 讓標題文字與按鈕分置左右
  title.style.display = "flex";
  title.style.justifyContent = "space-between";
  title.style.alignItems = "center";

  // 左側標題文字（前面帶一個可旋轉的箭頭 ▶ 表示折疊狀態）
  const titleText = document.createElement("span");
  titleText.innerHTML = `<span class="arrow">▶</span> ${sectionTitleText}`;
  title.appendChild(titleText);

  // 右側控制區：重複次數 + 速度拖曳桿 + 兩種循環按鈕
  const rightControls = document.createElement("div");
  rightControls.className = "section-right-controls";

  // 分兩列：第一列＝次數＋速度；第二列＝兩顆循環按鈕（與「次數」左緣對齊）
  const controlsRow1 = document.createElement("div");
  controlsRow1.className = "section-controls-row";
  const controlsRow2 = document.createElement("div");
  controlsRow2.className = "section-controls-row";

// ---------------- 發音功能核心 ----------------
//
// ⚠️ 重要：Google TTS 金鑰「不再」寫在前端，已改走 Cloudflare Worker 代理。
//   前端只把要唸的字送到你的代理網址；真正的 Google 金鑰存在 Worker 的 Secret 裡，
//   不會出現在這份原始碼中。代理只接受「來自本網站」的請求（用 Origin 判斷），
//   所以使用者不需要輸入任何通行碼，但別人也無法拿你的代理亂用。
//   部署與設定方式見專案內的 tts-proxy/README.md。
//
// TTS_PROXY_URL：你的 Cloudflare Worker 代理網址（部署後請改成自己的）。
const TTS_PROXY_URL = "https://toeic-tts.fuli62.workers.dev";

// speakWord：透過代理用 Google TTS 朗讀單字（真人音質）
// 參數：word=要唸的字、lang=語系(en-GB/en-US)、callback=播放結束後要執行的函式
let currentAudio = null; // 目前正在播放的 Google 語音（用來在下一次發音前先停掉，避免重疊）
async function speakWord(word, lang, callback) {
    // 先停掉目前正在播放的任何聲音，避免重疊
    window.speechSynthesis.cancel();
    if (currentAudio) { try { currentAudio.pause(); } catch(e){} currentAudio = null; }

    try {
        // 呼叫你的 Cloudflare Worker 代理（金鑰在 Worker 那端，前端看不到）
        const response = await fetch(TTS_PROXY_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ text: word, lang })
        });

        const data = await response.json();

        if (data.audioContent) {
            // 代理回傳 Base64 的 MP3，轉成可播放的音訊並播放
            const audio = new Audio("data:audio/mp3;base64," + data.audioContent);
            audio.playbackRate = getSpeechRate(); // 🇺🇸/🇬🇧 發音也跟著速度拖曳桿
            currentAudio = audio;
            audio.play();
            // 播放結束後執行 callback（例如抽考時自動跳下一題）
            audio.onended = () => { if (audio === currentAudio) currentAudio = null; if (callback) callback(); };
        } else {
            console.error("代理沒回傳音訊內容：", data);
            if (callback) callback();
        }
    } catch (error) {
        console.error("呼叫發音代理失敗：", error);
        if (callback) callback(); // 失敗也讓流程繼續，避免抽考卡住
    }
}
// playKKAudio：發音表播放
//   synth=1 → 用 Google TTS 的 SSML <phoneme> 合成「單音」（母音、m/n/ŋ/l/r）；
//   其餘（摩擦音/塞音/塞擦音/滑音）→ 直接唸英文例字。
function playKKAudio(slug, example, ipa, synth) {
    window.speechSynthesis.cancel();
    if (currentAudio) { try { currentAudio.pause(); } catch (e) {} currentAudio = null; }

    if (synth && ipa) { playSSMLPhoneme(ipa, example); return; } // 有 synth：合成單音
    if (example) speakWord(example, 'en-US');                    // 其餘：唸例字
}

// playSSMLPhoneme：用 SSML <phoneme>(IPA) 合成單一音素；放慢(rate=slow)讓氣音/摩擦音更清楚。失敗退回唸例字
async function playSSMLPhoneme(ipa, example) {
    const ssml = `<speak><prosody rate="slow"><phoneme alphabet="ipa" ph="${ipa}">-</phoneme></prosody></speak>`;
    try {
        const res = await fetch(TTS_PROXY_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ ssml, lang: "en-US" })
        });
        const data = await res.json();
        if (data.audioContent) {
            const a = new Audio("data:audio/mp3;base64," + data.audioContent);
            currentAudio = a;
            a.play();
            a.onended = () => { if (a === currentAudio) currentAudio = null; };
        } else {
            console.error("雙母音合成失敗：", data);
            if (example) speakWord(example, 'en-US');
        }
    } catch (e) {
        console.error("雙母音合成失敗：", e);
        if (example) speakWord(example, 'en-US');
    }
}

// repeatSpeak：循環重複朗讀單一單字（再按一次同一顆按鈕即停止）
// 這裡用的是瀏覽器內建的 SpeechSynthesis，不耗用 Google API 額度
function repeatSpeak(word, lang) {
  const key = word + lang; // 用「單字+語系」當作這顆按鈕的唯一識別

  // 若該按鈕已在重複播放中 → 視為「再按一次 = 停止」
  if (repeatStatus[key]) {
    speechSynthesis.cancel();
    repeatStatus[key] = false;
    return;
  }

  // 開始前先停掉其他聲音、清空其他按鈕的重複狀態（一次只重複一個）
  speechSynthesis.cancel();
  clearAllRepeatStatus();

  repeatStatus[key] = true; // 標記此按鈕為「重複中」

  // 每一次重播都「重新建立」utterance 並讀取當下的速度桿數值，
  // 這樣在重複播放途中拖曳速度桿，語速也會即時跟著改變。
  const speakOnce = () => {
    if (!repeatStatus[key]) return; // 已被停止就不再唸
    const u = new SpeechSynthesisUtterance(word);
    u.lang = lang;
    u.rate = getSpeechRate(); // 依「當下」的速度拖曳桿數值決定語速
    u.onend = () => { if (repeatStatus[key]) speakOnce(); }; // 唸完再唸下一次
    speechSynthesis.speak(u);
  };

  speakOnce();
}


// 把所有「重複朗讀」狀態清為 false（確保同時只有一個在循環）
function clearAllRepeatStatus() {
  for (const key in repeatStatus) {
    repeatStatus[key] = false;
  }
}

function searchWord() {
  // 取得輸入字串，去頭尾空白並轉小寫（不分大小寫比對）
  const query = document.getElementById("searchInput").value.trim().toLowerCase();
  if (!query) return; // 空字串不搜尋

  let found = false; // 是否有找到任何符合

  document.querySelectorAll(".term-card").forEach(card => {
    const word = card.dataset.word.toLowerCase();
    const row = card.closest(".content-row");      // 卡片所屬的內容列
    const title = row.previousElementSibling;       // 內容列前面的標題列

    card.querySelector(".word").classList.remove("highlight"); // 先清除舊的標亮

    // 只要單字「包含」搜尋字串就算命中
    if (word.includes(query)) {
      found = true;
      row.classList.remove("collapsed");                 // 展開所屬區塊
      title.querySelector(".arrow").classList.add("rotate");

      card.querySelector(".word").classList.add("highlight"); // 標亮命中的單字
      card.scrollIntoView({ behavior: "smooth", block: "center" }); // 平滑捲動到該卡
    }
  });

  if (!found) {
    alert("找不到該單字！");
  }
}

// 把發音資料渲染成一張張「音節拆解卡」
// 渲染 KK 音標一覽表：每格＝[符號] + 英文例字 + 發音鈕（播放例字示範該音）
function renderPronounce(data) {
    const box = document.getElementById("pronounce-container");
    if (!data || (!data.vowels && !data.consonants)) {
        box.innerHTML = `<p style="color:red">發音表格式有誤。</p>`;
        return;
    }
    // 產生單一格：符號、例字＋例字的 KK、播放鈕
    // 🔊 播放規則：synth=用 TTS 合成單音(雙母音)；否則優先播本地音檔，沒有才唸例字
    const cell = it => {
        const ex = (it.example || "").replace(/'/g, "\\'");
        const au = (it.audio || "").replace(/'/g, "\\'");
        const ip = (it.ipa || "").replace(/'/g, "\\'");
        const synth = it.synth ? "1" : "";
        return `<div class="kk-cell">
            <span class="kk-symbol">[${it.symbol}]</span>
            <span class="kk-example">${it.example || ""}${it.exampleKK ? ` <span class="kk-ex-kk">${it.exampleKK}</span>` : ""}</span>
            <button class="kk-play" title="播放這個 KK 音" onclick="playKKAudio('${au}','${ex}','${ip}','${synth}')">🔊</button>
        </div>`;
    };
    const grid = arr => `<div class="kk-grid">${(arr || []).map(cell).join("")}</div>`;

    const v = data.vowels || {};
    box.innerHTML = `
        <p class="kk-intro">點各音標的 🔊 會唸出該音的英文例字（自然發音示範這個 KK 音）。</p>

        <div class="kk-block-title">母音 Vowels</div>
        <div class="kk-sub-label">單母音</div>
        ${grid(v.single)}
        <div class="kk-sub-label">雙母音</div>
        ${grid(v.diphthong)}

        <div class="kk-block-title">子音 Consonants</div>
        ${grid(data.consonants)}
    `;
}

// ========================= 文法分頁：載入與渲染 =========================
let grammarLoaded = false; // 是否已載入過文法資料
async function initGrammar() {
    if (grammarLoaded) return; // 只載入一次
    grammarLoaded = true;
    const box = document.getElementById("grammar-container");
    try {
        // 讀取文法架構（6 大類，每類含多個子項）
        // 加上時間戳避免瀏覽器/GitHub Pages 快取舊的 grammar.json（內容更新後才看得到）
        const res = await fetch("Grammar/grammar.json?t=" + Date.now());
        if (!res.ok) throw new Error("無法讀取 Grammar/grammar.json");
        const data = await res.json();
        renderGrammar(data);
    } catch (err) {
        grammarLoaded = false; // 失敗允許之後重試
        console.error(err);
        box.innerHTML = `<p style="color:red">文法載入失敗：${err.message}</p>`;
    }
}

// 把單一文法子項的 content 物件組成教學內容 HTML
//   兩種格式：
//   (A) 完整教學文章：{ blocks: [ {type:"h"|"p"|"list"|"note"|"examples", ...} ] }
//   (B) 精簡格式（佔位用）：{ point, structure[], examples[{en,zh}], tip }
function grammarDetailHtml(c) {
    if (!c) return "🚧 詳細內容製作中，敬請期待～";

    // 例句格子：ex 可為單一物件或陣列 {en,zh,note}；en/zh 支援 <k>(綠)/<b>(藍) 標記
    const exCell = ex => {
        if (!ex) return "";
        const arr = Array.isArray(ex) ? ex : [ex];
        return arr.map(e =>
            `<span class="g-en">${e.en || ""}</span>` +
            (e.zh ? `<span class="g-zh">${e.zh}</span>` : "") +
            (e.note ? `<span class="g-arrow">➤ ${e.note}</span>` : "")
        ).join(`<span class="g-exsep"></span>`);
    };

    // (A) 完整文章：依 blocks 逐段渲染
    if (c.blocks) {
        return c.blocks.map(b => {
            if (b.type === "h") return `<div class="g-h">${b.text}</div>`;
            if (b.type === "p") return `<p class="g-p">${b.text}</p>`;
            if (b.type === "list") return `<ul class="g-list">${b.items.map(i => `<li>${i}</li>`).join("")}</ul>`;
            if (b.type === "note") return `<div class="g-note">${b.text}</div>`;

            // ── 新版式：公式區塊（多行同樣大，green 框）──
            if (b.type === "formula") {
                const rows = (b.lines || []).map((ln, i) =>
                    (i > 0 ? `<div class="gf-div"></div>` : "") +
                    `<div class="gf-row">${ln.label ? `<span class="gf-tag">${ln.label}</span>` : ""}<div class="gf-main">${ln.text || ""}</div></div>`
                ).join("");
                return `<div class="g-formula">${rows}</div>`;
            }
            // ── 新版式：變化規則表（規則｜例句）──
            if (b.type === "ruletable") {
                const head = b.head || ["變化規則", "例句"];
                const rows = (b.rows || []).map(r =>
                    `<tr><td class="grt-rule"><span class="grt-name">${r.name || ""}</span>` +
                    (r.change ? `<span class="grt-chg">${r.change}</span>` : "") +
                    (r.sub ? `<span class="grt-sub">${r.sub}</span>` : "") + `</td>` +
                    `<td class="grt-ex">${exCell(r.ex)}</td></tr>`
                ).join("");
                return `<table class="g-tbl grt"><thead><tr><th class="grt-hrule">${head[0]}</th><th>${head[1]}</th></tr></thead><tbody>${rows}</tbody></table>`;
            }
            // ── 新版式：使用時機表（用法徽章｜說明｜例句）──
            if (b.type === "usetable") {
                const head = b.head || ["用法", "說明", "例句"];
                const rows = (b.rows || []).map(r =>
                    `<tr><td class="gc-n"><span class="g-badge">${r.n || ""}</span></td>` +
                    `<td class="gc-note">${r.note || ""}${r.hint ? `<span class="gc-hint">${r.hint}</span>` : ""}</td>` +
                    `<td class="grt-ex">${exCell(r.ex)}</td></tr>`
                ).join("");
                return `<table class="g-tbl"><thead><tr><th class="gc-hn">${head[0]}</th><th class="gc-hnote">${head[1]}</th><th>${head[2]}</th></tr></thead><tbody>${rows}</tbody></table>`;
            }
            // ── 新版式：常見錯誤表（錯誤徽章｜說明｜✗→✓）──
            if (b.type === "errtable") {
                const head = b.head || ["錯誤", "說明", "對照"];
                const rows = (b.rows || []).map(r =>
                    `<tr><td class="gc-n"><span class="g-badge err">${r.n || ""}</span></td>` +
                    `<td class="gc-note">${r.note || ""}</td>` +
                    `<td class="grt-ex"><span class="g-en"><span class="g-bad">✗ ${r.wrong || ""}</span> → <span class="g-good">✓ ${r.right || ""}</span></span></td></tr>`
                ).join("");
                return `<table class="g-tbl"><thead><tr><th class="gc-hn">${head[0]}</th><th class="gc-hnote">${head[1]}</th><th>${head[2]}</th></tr></thead><tbody>${rows}</tbody></table>`;
            }
            // 時態時間軸／關係圖：一律用自製 SVG（不可用來源圖片），直接內嵌
            if (b.type === "diagram") return `<div class="g-diagram">${b.svg || ""}</div>`;
            // （備用）自製的圖片檔
            if (b.type === "image") return `<img class="g-img" src="${b.src}" alt="${b.alt || ""}" loading="lazy">`;
            if (b.type === "examples") {
                // 例句的 en/zh 允許用 <k>（綠色）、<b>（藍色）標記關鍵字，白字為底凸顯重點
                return `<div class="g-exbox">` + b.items.map(e =>
                    `<div class="g-ex"><span class="g-en">${e.en}</span><span class="g-zh">${e.zh}</span>` +
                    (e.note ? `<span class="g-exnote">➤ ${e.note}</span>` : "") + `</div>`
                ).join("") + `</div>`;
            }
            return "";
        }).join("");
    }

    // (B) 精簡格式
    let html = "";
    if (c.point) html += `<p class="g-point">${c.point}</p>`;
    if (c.structure && c.structure.length) {
        html += `<div class="g-block"><div class="g-label">結構</div><ul class="g-structure">` +
            c.structure.map(s => `<li>${s}</li>`).join("") + `</ul></div>`;
    }
    if (c.examples && c.examples.length) {
        html += `<div class="g-block"><div class="g-label">例句</div>` +
            c.examples.map(e => `<div class="g-ex"><span class="g-en">${e.en}</span><span class="g-zh">${e.zh}</span></div>`).join("") +
            `</div>`;
    }
    if (c.tip) html += `<div class="g-tip">💡 ${c.tip}</div>`;
    return html;
}

    const box = document.getElementById("grammar-container");
    box.innerHTML = "";

    data.forEach(cat => {
        const sec = document.createElement("section");
        sec.className = "grammar-section";

        // 類別標題（可點擊折疊；右邊顯示子項數量）
        const head = document.createElement("div");
        head.className = "grammar-cat-title";
        head.innerHTML = `<span class="arrow">▶</span> ${cat.category} <span class="grammar-count">${cat.topics.length}</span>`;

        cat.topics.forEach(t => {
            const item = document.createElement("div");

                <div class="grammar-item-title">${t.title} <span class="grammar-item-arrow">›</span></div>

            list.appendChild(item);
        });

        sec.appendChild(head);
        sec.appendChild(list);
        box.appendChild(sec);
    });
}

// --- 測驗功能專用的全域變數 ---
let quizPool = {};            // 測驗池：{ 區塊名稱: [ {en, cn}, ... ] }，由 loadWordsFromFile 填入
let currentQuizList = [];     // 本次測驗實際使用的題目清單（依範圍篩選後）
let quizIndex = 0;            // 目前進行到第幾題
let correctCount = 0;         // 答對題數
let wrongCount = 0;           // 答錯題數
let isAnswering = false;      // 是否正在處理作答（避免一題重複點擊）
let currentQuizType = "en-cn";// 目前題型（預設 en-cn 英選中；另有 cn-en 中選英）
let wrongWords = [];          // 本次測驗答錯的單字清單（[{en, cn}, ...]），測驗結束可匯出
let unfamiliarFileHandle = null; // 記住使用者選定的 Unfamiliar.json 檔案handle（同一次開啟頁面內只需選一次）

// 洗牌演算法（Fisher–Yates）：把陣列順序隨機打亂
function shuffleArray(array) {
    for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]]; // 交換 i 與 j
    }
}

// 更新測驗範圍核取方塊（由 loadWordsFromFile 在載入成功後呼叫）
// 為每個載入的單字區塊新增一個可勾選的選項，支援複選
function updateQuizRangeUI(catName) {
    const box = document.getElementById("quizRange");
    // 若該範圍尚未存在才新增，避免重複
    const exists = Array.from(box.querySelectorAll('input[type="checkbox"]')).some(c => c.value === catName);
    if (exists) return;

    const label = document.createElement("label");
    label.className = "range-item";

    const cb = document.createElement("input");
    cb.type = "checkbox";
    cb.value = catName;
    cb.addEventListener("change", () => onRangeCheckboxChange(cb));

    label.appendChild(cb);
    label.appendChild(document.createTextNode(" " + catName));
    box.appendChild(label);
}

// 切換測驗範圍核取方塊群組的展開／收合（預設收合）
function toggleQuizRange() {
    const box = document.getElementById("quizRange");
    const arrow = document.querySelector("#quizRangeToggle .range-arrow");
    const collapsed = box.classList.toggle("collapsed"); // 切換後是否為收合
    if (arrow) arrow.textContent = collapsed ? "▶" : "▼"; // ▶=收合、▼=展開
}

// 處理測驗範圍核取方塊的互動邏輯（讓「全部範圍」與「特定範圍」彼此排斥）
function onRangeCheckboxChange(cb) {
    const box = document.getElementById("quizRange");
    const allCb = box.querySelector('input[value="all"]');
    const others = Array.from(box.querySelectorAll('input[type="checkbox"]')).filter(c => c.value !== "all");

    if (cb.value === "all") {
        // 勾選「全部範圍」→ 取消其餘所有特定範圍
        if (cb.checked) others.forEach(c => c.checked = false);
    } else {
        // 勾任何一個特定範圍 → 取消「全部範圍」
        if (cb.checked && allCb) allCb.checked = false;
        // 若所有特定範圍都被取消，則自動勾回「全部範圍」，避免一個都沒選
        if (allCb && !others.some(c => c.checked)) allCb.checked = true;
    }
}

// 修改 loadWordsFromFile 內部邏輯以支援 UI 更新
// (請確保你先前的 loadWordsFromFile 函式末端有呼叫 updateQuizRangeUI)
// 為了保險起見，這裡提供一個「自動修復版」的測驗範圍初始化
// openQuiz：按下「開始抽考」時呼叫，準備題目並開啟測驗彈窗
function openQuiz() {
    const box = document.getElementById("quizRange");
    const checked = Array.from(box.querySelectorAll('input[type="checkbox"]:checked')); // 所有勾選的範圍
    currentQuizType = document.getElementById("quizMode").value;     // 選定題型
    currentQuizList = [];

    // 勾了「全部範圍」或一個都沒勾 → 使用全部
    const useAll = checked.length === 0 || checked.some(c => c.value === "all");

    if(useAll) {
        // 全部範圍：把測驗池裡所有區塊的單字合併
        Object.values(quizPool).forEach(list => currentQuizList.push(...list));
    } else {
        // 複選的特定範圍：把每個被勾選範圍的單字合併進來
        checked.forEach(c => {
            if (quizPool[c.value]) currentQuizList.push(...quizPool[c.value]);
        });
    }

    // 至少要 4 個單字才能湊出「1 正解 + 3 干擾項」
    if(currentQuizList.length < 4) {
        alert("該範圍單字量不足 4 個，無法開始測驗！");
        return;
    }

    // 打亂題序，並重置所有計數與清單
    shuffleArray(currentQuizList);
    quizIndex = 0;
    correctCount = 0;
    wrongCount = 0;
    wrongWords = []; // 清空上一次測驗的錯誤單字紀錄
    document.getElementById("correctList").innerHTML = "";
    document.getElementById("wrongList").innerHTML = "";
    document.getElementById("quizCorrect").textContent = "0";
    document.getElementById("quizWrong").textContent = "0";
    document.getElementById("quizModal").style.display = "flex"; // 顯示測驗彈窗

    nextQuestion(); // 出第一題
}

// ... 剩下的 closeQuiz, nextQuestion, handleAnswer, updateSideList, finishQuiz 邏輯保持不變 ...

// closeQuiz：關閉測驗彈窗（中途離開會先確認）
function closeQuiz() {
    // 提前結束：不再確認、直接離開
    speechSynthesis.cancel(); // 停止可能正在播放的發音
    if (currentAudio) { try { currentAudio.pause(); } catch (e) {} currentAudio = null; }
    document.getElementById("quizModal").style.display = "none";
}
// nextQuestion：出下一題（產生題目與四個選項）
function nextQuestion() {
    // 題目出完 → 進入結算畫面
    if (quizIndex >= currentQuizList.length) {
        finishQuiz();
        return;
    }

    isAnswering = false; // 解除作答鎖
    document.getElementById("quizFeedback").textContent = "";
    // 清掉上一題題目框的綠/紅回饋色
    document.getElementById("quizQuestionCN").classList.remove("correct", "wrong");
    document.getElementById("quizProgress").textContent = `進度: ${quizIndex + 1} / ${currentQuizList.length}`;

    const optionsBox = document.getElementById("quizOptions");
    optionsBox.innerHTML = ""; // 清空上一題的選項

    const target = currentQuizList[quizIndex]; // 本題正解

    // --- 根據題型決定題目顯示哪一面 ---
    // 中選英：題目顯示中文；英選中：題目顯示英文
    document.getElementById("quizQuestionCN").textContent =
        (currentQuizType === "cn-en") ? target.cn : target.en;

    // 從「所有單字」中抽 3 個當干擾項
    let allFlattened = [];
    Object.values(quizPool).forEach(l => allFlattened.push(...l));

    let distractors = [];
    while(distractors.length < 3) {
        let rand = allFlattened[Math.floor(Math.random() * allFlattened.length)];
        // 確保干擾項彼此不重複，且不等於正解
        if(rand.en !== target.en && !distractors.find(d => d.en === rand.en)) {
            distractors.push(rand);
        }
    }

    // 正解 + 三個干擾項，洗牌後當作四個選項
    let options = [target, ...distractors].sort(() => Math.random() - 0.5);

    options.forEach(opt => {
        const btn = document.createElement("button");
        btn.className = "option-btn";

        // --- 根據題型決定選項按鈕顯示哪一面 ---
        // 中選英：按鈕顯示英文；英選中：按鈕顯示中文
        btn.textContent = (currentQuizType === "cn-en") ? opt.en : opt.cn;

        btn.onclick = () => handleAnswer(opt, target, btn); // 點選即作答
        optionsBox.appendChild(btn);
    });

    // --- 一進到新題目就先唸一遍題目給測驗者聽 ---
    // 只在「英選中」（題目是英文）才唸；「中選英」題目是中文、且英文是答案，
    // 用英文語音唸中文會壞掉、也會洩題，故略過。
    if (currentQuizType === "en-cn") {
        speakWord(target.en, 'en-US');
    }
}

// handleAnswer：處理使用者點選某個選項後的判定與回饋
function handleAnswer(selectedObj, targetObj, btnElement) {
    if(isAnswering) return; // 已在處理就忽略（避免連點）
    isAnswering = true;

    const isCorrect = selectedObj.en === targetObj.en; // 以英文為準判斷對錯
    const qBox = document.getElementById("quizQuestionCN"); // 題目框（用它變色回饋）
    const feedback = document.getElementById("quizFeedback");

    if(isCorrect) {
        // 答對：加分、按鈕標綠、題目框變綠、加入左側正確清單
        correctCount++;
        document.getElementById("quizCorrect").textContent = correctCount;
        btnElement.classList.add("option-correct");
        qBox.classList.add("correct");   // ← 主要回饋：題目框變綠
        feedback.textContent = "";
        updateSideList("correctList", targetObj, "correct");
    } else {
        // 答錯：加錯誤數、按鈕標紅、題目框變紅、加入右側錯誤清單
        wrongCount++;
        document.getElementById("quizWrong").textContent = wrongCount;
        btnElement.classList.add("option-wrong");
        qBox.classList.add("wrong");     // ← 主要回饋：題目框變紅
        feedback.textContent = "";

        const correctText = (currentQuizType === "cn-en") ? targetObj.en : targetObj.cn;
        updateSideList("wrongList", targetObj, "wrong");

        // 記錄答錯的單字（供測驗結束時匯出）；以英文去重，避免同一字重複多筆
        if (!wrongWords.some(w => w.en === targetObj.en)) {
            wrongWords.push({ en: targetObj.en, cn: targetObj.cn });
        }

        // 把正確的那個選項標綠，讓使用者看到答案
        Array.from(document.querySelectorAll(".option-btn")).forEach(b => {
            if(b.textContent === correctText) b.classList.add("option-correct");
        });
    }

    // 中選英：作答後唸出正確答案（英文），順便讓使用者學正確發音。
    //   語音會延續到下一題（下一題題目是中文、不會朗讀，不衝突），所以操作速度維持和英選中一樣快。
    if (currentQuizType === "cn-en") speakWord(targetObj.en, 'en-US');

    // 停頓後進下一題（兩種題型都 0.5 秒，操作一樣快速）
    quizIndex++;
    setTimeout(nextQuestion, 500);
}

// updateSideList：把單字加入左（正確）或右（錯誤）側清單，最新的排最上面
function updateSideList(listId, wordObj, type) {
    const list = document.getElementById(listId);
    const item = document.createElement("div");
    item.className = `sidebar-item ${type}`;

    // 跳脫單引號，避免塞進 onclick 字串時出錯
    const safeEn = wordObj.en.replace(/'/g, "\\'");

    // 每個清單項目：英文（粗體）+ 中文（小字）+ 一顆重聽發音鈕
    item.innerHTML = `
        <div>
            <b>${wordObj.en}</b><br>
            <small>${wordObj.cn}</small>
        </div>
        <button class="speak-button" onclick="speakWord('${safeEn}', 'en-US')">🔊</button>
    `;
    // insertBefore 到第一個 → 最新項目顯示在最上方
    list.insertBefore(item, list.firstChild);
}

// finishQuiz：所有題目作答完畢，顯示結算結果
function finishQuiz() {
    // 若本次有答錯的單字，就多顯示一顆「儲存錯誤單字」按鈕
    const saveBtnHtml = (wrongWords.length > 0)
        ? `<button class="search-button" style="margin-top:10px;" onclick="saveWrongWords(this)">💾 儲存錯誤單字（${wrongWords.length}）到 Unfamiliar.json</button>`
        : "";

    const qBoxEnd = document.getElementById("quizQuestionCN");
    qBoxEnd.classList.remove("correct", "wrong"); // 清掉最後一題的綠/紅色
    qBoxEnd.textContent = "🎊 測驗完成！";
    document.getElementById("quizOptions").innerHTML = `
        <div style="color:#fff; font-size: 20px; margin: 20px 0;">
            正確題數：${correctCount} <br>
            錯誤題數：${wrongCount}
        </div>
        ${saveBtnHtml}
        <button class="search-button" onclick="document.getElementById('quizModal').style.display='none'">關閉結果</button>
    `;
    document.getElementById("quizFeedback").textContent = "";
}

// ============================================================
// saveWrongWords：把本次測驗答錯的單字存進 Unfamiliar.json
// ------------------------------------------------------------
// 機制：
//  - 支援 File System Access API 的瀏覽器（Chrome / Edge）：
//      使用者選定本機的 Unfamiliar.json 一次後，直接讀取→去重附加→寫回該檔。
//      （同一次開啟頁面內會記住檔案 handle，不必每次重選）
//  - 不支援的瀏覽器（Firefox / Safari 等）：
//      自動退回「下載一個 JSON 檔」，內容為本次新增的單字（需自行併入）。
// 產生的單字物件格式與 word/*.json 完全相同：
//   { word, kk, translation, part_of_speech, note }
// ============================================================
async function saveWrongWords(btn) {
    if (!wrongWords.length) { alert("本次沒有答錯的單字！"); return; }

    // 把答錯單字轉成與 word/*.json 相同的物件格式（音標/詞性/筆記先留空）
    const newEntries = wrongWords.map(w => ({
        word: w.en,
        kk: "",
        translation: w.cn,
        part_of_speech: "",
        note: ""
    }));

    // ---------- 路線 A：支援 File System Access API → 直接寫回本機檔 ----------
    if (window.showOpenFilePicker) {
        try {
            // 若這次開頁尚未選過檔案，請使用者選定 Unfamiliar.json（之後沿用）
            if (!unfamiliarFileHandle) {
                [unfamiliarFileHandle] = await window.showOpenFilePicker({
                    types: [{ description: "JSON 單字檔", accept: { "application/json": [".json"] } }],
                    multiple: false
                });
            }

            // 確認對該檔有「讀寫」權限，沒有就請求
            let perm = await unfamiliarFileHandle.queryPermission({ mode: "readwrite" });
            if (perm !== "granted") {
                perm = await unfamiliarFileHandle.requestPermission({ mode: "readwrite" });
            }
            if (perm !== "granted") { alert("沒有取得寫入權限，已取消。"); return; }

            // 讀取檔案現有內容並解析成陣列
            const file = await unfamiliarFileHandle.getFile();
            const text = (await file.text()).trim();
            let arr = [];
            if (text) {
                try { arr = JSON.parse(text); } catch (e) { arr = []; }
            }
            if (!Array.isArray(arr)) arr = [];

            // 以 word（小寫）去重：已存在的單字就略過，只加新的
            const existing = new Set(arr.map(o => (o.word || "").toLowerCase()));
            let added = 0;
            newEntries.forEach(e => {
                if (!existing.has(e.word.toLowerCase())) {
                    arr.push(e);
                    existing.add(e.word.toLowerCase());
                    added++;
                }
            });

            // 寫回檔案（用 2 空格縮排，維持可讀性）
            const writable = await unfamiliarFileHandle.createWritable();
            await writable.write(JSON.stringify(arr, null, 2));
            await writable.close();

            if (btn) { btn.textContent = `✓ 已寫入 ${added} 個新單字`; btn.disabled = true; }
            alert(`已寫入 ${added} 個新單字到 ${unfamiliarFileHandle.name}（重複的已自動略過）。`);
            return;
        } catch (err) {
            if (err && err.name === "AbortError") return; // 使用者按取消，不算錯誤
            console.error("寫入失敗，改用下載：", err);
            // 失敗則往下走，改用下載備援
        }
    }

    // ---------- 路線 B：備援 → 下載一個 JSON 檔 ----------
    const blob = new Blob([JSON.stringify(newEntries, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "Unfamiliar_新增.json";
    a.click();
    URL.revokeObjectURL(url);
    alert("你的瀏覽器不支援直接寫檔，已改為下載 JSON 檔，請手動併入 word/Unfamiliar.json。");
}

  // 切換單個單字的顯示/隱藏
  // ⚠️ 注意：此函式與 index.js 內的 toggleSingleWord 同名。
  //    因為 index.js 是 defer 較晚執行，最終生效的是 index.js 的版本。
  //    此處保留為早期版本。
function toggleSingleWord(btn) {
    const mainText = btn.nextElementSibling; // 眼睛按鈕的下一個元素就是 main-text
    mainText.classList.toggle("hidden-word");

    // 切換眼睛圖示
    if (mainText.classList.contains("hidden-word")) {
        btn.textContent = "🙈";
    } else {
        btn.textContent = "👁️";
    }
}

// 全域控制：全部顯示或全部隱藏（同樣與 index.js 內的同名函式並存，最終以 index.js 為準）
function toggleAllWords(shouldHide) {
    const allWords = document.querySelectorAll(".main-text");
    const allEyeBtns = document.querySelectorAll(".eye-btn");

    allWords.forEach(word => {
        if (shouldHide) {
            word.classList.add("hidden-word");
        } else {
            word.classList.remove("hidden-word");
        }
    });

    allEyeBtns.forEach(btn => {
        btn.textContent = shouldHide ? "🙈" : "👁️";
    });
}


  // toggleNote：切換單一字卡的筆記顯示/隱藏（點卡片上的 📝 按鈕觸發）
function toggleNote(btn) {
    // 找到同一張字卡內的 .note-content
    const card = btn.closest('.term-card');
    const noteContent = card.querySelector(".note-content");
    if (noteContent) {
        noteContent.classList.toggle("show");
        // 開啟時把按鈕調半透明，作為「已展開」的視覺提示
        btn.style.opacity = noteContent.classList.contains("show") ? "0.5" : "1";
    }
}

  // sectionLoopStatus：記錄各區塊是否正在循環朗讀（key = 區塊名稱）
const sectionLoopStatus = {};

// sectionLoopButtons：記錄各區塊標題列的循環按鈕（key = 區塊名稱），供「繼續循環」更新外觀
const sectionLoopButtons = {};

// 🎯 把所有循環按鈕外觀重置回各自的預設標籤（未播放狀態）
//    因為現在每個區塊有兩顆循環鈕（英文 / 英中），各自用 dataset.defaultLabel 還原
function resetAllLoopButtons() {
    document.querySelectorAll(".section-title .loop-btn").forEach(btn => {
        btn.innerText = btn.dataset.defaultLabel || "🔁 循環播放區塊";
        btn.style.backgroundColor = "transparent";
        btn.style.color = "#00ff99";
    });
}

// 🎯 完全停止循環播放（由區塊標題的停止鈕、或發音錯誤時呼叫）
//    會清除狀態、移除所有高亮與跟隨鈕（不保留續播位置）
function stopLoopPlayback() {
    if (currentLoopingSection) {
        sectionLoopStatus[currentLoopingSection] = false; // 標記停止
    }
    window.speechSynthesis.cancel(); // 停掉發音

    resetAllLoopButtons(); // 兩顆循環鈕都還原成預設外觀

    // 移除所有卡片的高亮效果
    document.querySelectorAll(".term-card.loop-highlight").forEach(card => {
        card.classList.remove("loop-highlight");
    });

    // 移除附著在卡片上的跟隨鈕
    removeFollowStopBtn();

    currentLoopingSection = null; // 清除目前循環中的區塊記錄
}

// 🎯 暫停循環播放（由卡片上的「停止循環」跟隨鈕呼叫）
//    與「完全停止」不同：保留目前卡片的高亮與跟隨鈕，並把鈕變成「繼續循環」，
//    使用者之後可從這張卡片、用原本的模式續播。
function pauseLoopPlayback() {
    if (!currentLoopingSection) return;
    const section = currentLoopingSection;
    const mode = currentLoopMode; // 記住目前模式，續播時沿用

    // 以跟隨鈕所在的卡片作為「停在哪裡」的依據（即使在單字間的空檔也準確）
    const btn = document.getElementById("followStopBtn");
    const card = btn ? btn.closest(".term-card") : null;
    const word = card ? card.dataset.word : null;

    // 先更新狀態再取消發音，讓 onend/onerror 的防護判斷看到最新狀態
    sectionLoopStatus[section] = false;
    currentLoopingSection = null;
    window.speechSynthesis.cancel();

    resetAllLoopButtons(); // 兩顆循環鈕都還原成預設外觀

    // 保留該卡片高亮，標示停在哪一張
    if (card) card.classList.add("loop-highlight");

    // 把跟隨鈕改成「繼續循環」（留在原卡片），點下可用原本模式從這張卡片續播
    if (btn) setFollowBtnPaused(btn, section, word, mode);
}

// 🎯 繼續循環播放：從指定單字、用原本的模式重新啟動該區塊的循環
function resumeLoopPlayback(sectionName, startWord, mode) {
    startSectionLoop(sectionName, startWord, mode);
}

// toggleSectionLoop：切換某區塊某模式的循環（由兩顆循環按鈕呼叫）
//   mode：'en'＝只唸英文；'en-cn'＝英文一遍中文一遍
function toggleSectionLoop(sectionName, mode) {
    // 若該區塊正在播放
    if (sectionLoopStatus[sectionName]) {
        const wasMode = currentLoopMode;
        stopLoopPlayback();
        // 點的是「同一模式」→ 視為停止；點的是「另一種模式」→ 改用新模式重新開始
        if (wasMode !== mode) {
            startSectionLoop(sectionName, null, mode);
        }
        return;
    }
    // 否則：從該區塊第一個單字開始，用指定模式循環
    startSectionLoop(sectionName, null, mode);
}

// startSectionLoop：實際啟動某區塊的循環朗讀
//   sectionName：要播放的區塊名稱
//   startWord：從哪個英文單字開始（null = 從頭；用於「繼續循環」從某張卡片續播）
//   mode：'en' 只唸英文 / 'en-cn' 英文一遍中文一遍
function startSectionLoop(sectionName, startWord, mode) {
    mode = mode || "en";
    currentLoopMode = mode; // 記住目前模式，供暫停/續播使用

    const btnMap = sectionLoopButtons[sectionName] || {}; // { en: 按鈕, "en-cn": 按鈕 }
    const btnElement = btnMap[mode];                       // 目前模式對應的按鈕
    // 此區塊的 <section> 容器：找卡片只在這範圍內找，避免抓到「其他區塊的同名單字」
    const sectionEl = btnElement ? btnElement.closest("section") : null;

    // 開始前：停掉其他正在進行的發音，並把所有循環按鈕還原
    window.speechSynthesis.cancel();
    resetAllLoopButtons();

    // 清空狀態，確保一次只有一個區塊在循環
    for (let key in sectionLoopStatus) sectionLoopStatus[key] = false;
    sectionLoopStatus[sectionName] = true;
    currentLoopingSection = sectionName;

    // 把這個模式的按鈕改成「停止」外觀（綠底黑字）
    if (btnElement) {
        btnElement.innerText = "⏹ 停止播放";
        btnElement.style.backgroundColor = "#00ff99";
        btnElement.style.color = "#000";
    }

    // 取出該區塊的單字清單（每個元素含 en 英文、cn 中文）
    const words = quizPool[sectionName];
    if (!words || words.length === 0) return;

    // 決定起始索引：從指定單字開始，找不到（或未指定）就從 0
    let currentIndex = 0;
    if (startWord) {
        const idx = words.findIndex(w => w.en === startWord);
        if (idx >= 0) currentIndex = idx;
    }

    // speakCard：唸「目前這張卡片」的內容（依模式與重複次數），唸完再換下一張
    function speakCard() {
        if (!sectionLoopStatus[sectionName]) return; // 已停止就結束

        const wordObj = words[currentIndex];

        // 找到該卡片並高亮（只在目前區塊內找，避免捲到別的同名卡片）
        const card = findCardByWord(wordObj.en, sectionEl);
        if (card) highlightCard(card);

        // 依「重複次數」與「模式」組出這張卡片要唸的序列（queue）
        // en 模式：英文 ×reps；en-cn 模式：(英文→中文) ×reps
        const reps = getRepeatCount(); // 1 / 2 / 3
        const queue = [];
        for (let r = 0; r < reps; r++) {
            queue.push({ text: wordObj.en, lang: "en-US" });
            if (mode === "en-cn" && wordObj.cn) {
                queue.push({ text: wordObj.cn, lang: "zh-TW" });
            }
        }

        // 依序唸出 queue 裡的每一段
        let qi = 0;
        function speakNext() {
            if (!sectionLoopStatus[sectionName]) return;

            if (qi >= queue.length) {
                // 這張卡片唸完 → 移除高亮、換下一張（間隔 1 秒）
                if (card) removeHighlightCard(card);
                currentIndex = (currentIndex + 1) % words.length;
                setTimeout(speakCard, 1000);
                return;
            }

            const item = queue[qi++];
            const u = new SpeechSynthesisUtterance(item.text);
            u.lang = item.lang;                // 英文 en-US；中文 zh-TW
            u.rate = getSpeechRate();          // 依速度拖曳桿決定語速

            u.onend = () => {
                if (sectionLoopStatus[sectionName]) setTimeout(speakNext, 300); // 同卡片內每段間隔 0.3 秒
            };
            u.onerror = () => {
                if (currentLoopingSection !== sectionName) return; // 已停止/暫停就忽略
                stopLoopPlayback();
            };
            window.speechSynthesis.speak(u);
        }

        speakNext();
    }

    speakCard(); // 啟動循環
}

// 🎯 根據單字（英文）找到對應的單字卡 DOM 元素
//    scope：可選的搜尋範圍（例如某個 <section>）。有給就先在範圍內找，
//    避免不同區塊有同名單字時抓錯卡片；範圍內找不到才退回全頁搜尋。
function findCardByWord(word, scope) {
    if (scope) {
        const inScope = scope.querySelectorAll(".term-card");
        for (let card of inScope) {
            if (card.dataset.word === word) return card;
        }
    }
    const cards = document.querySelectorAll(".term-card");
    for (let card of cards) {
        if (card.dataset.word === word) { // 比對 data-word
            return card;
        }
    }
    return null; // 找不到回傳 null
}

// 🎯 高亮卡片 - 加上互動效果並捲動到螢幕中央
//    （高亮樣式 .loop-highlight 在 CSS 中設定為與滑鼠 hover 相同：放大＋變色）
function highlightCard(card) {
    // 先移除其他卡片的高亮，確保同時只有一張卡片被高亮
    document.querySelectorAll(".term-card").forEach(c => {
        if (c !== card) {
            c.classList.remove("loop-highlight");
        }
    });

    // 為目前這張卡片加上高亮
    card.classList.add("loop-highlight");

    // 🎯 把「停止循環」跟隨鈕附著到目前朗讀的卡片（位於英/中按鈕下方）
    attachFollowStopBtn(card);

    // 平滑捲動，讓目前單字卡置於螢幕中央
    card.scrollIntoView({ behavior: "smooth", block: "center" });
}

// 🎯 取得（或建立）跟隨鈕，並附著到指定卡片
//    這顆鈕只建立一次（用 id 重複取用），會跟著目前朗讀的卡片移動。
//    每次附著（即朗讀中）都會把它設回「停止循環」狀態。
function attachFollowStopBtn(card) {
    let btn = document.getElementById("followStopBtn");
    if (!btn) {
        // 第一次：建立按鈕
        btn = document.createElement("button");
        btn.id = "followStopBtn";
        btn.className = "follow-stop-btn"; // 樣式（直書、綠色）在 CSS
    }
    setFollowBtnPlaying(btn); // 朗讀中 → 設為「停止循環」狀態

    // 附著到卡片右側的英/中按鈕容器（.eye-controls）下方；找不到就退回卡片本身
    const target = card ? (card.querySelector(".eye-controls") || card) : null;
    if (target && btn.parentElement !== target) {
        target.appendChild(btn); // appendChild 會把同一顆鈕「搬移」到新卡片，達成跟隨
    }
}

// 設定跟隨鈕為「播放中」狀態：顯示「停止循環」，點擊會暫停（保留位置可續播）
function setFollowBtnPlaying(btn) {
    btn.textContent = "停止循環";
    btn.classList.remove("paused");
    btn.onclick = (e) => {
        e.stopPropagation();   // 阻止冒泡，避免誤觸卡片其他事件
        pauseLoopPlayback();   // 點下即暫停
    };
}

// 設定跟隨鈕為「已暫停」狀態：顯示「繼續循環」，點擊會用原本模式從該卡片續播
function setFollowBtnPaused(btn, sectionName, startWord, mode) {
    btn.textContent = "繼續循環";
    btn.classList.add("paused");
    btn.onclick = (e) => {
        e.stopPropagation();
        resumeLoopPlayback(sectionName, startWord, mode); // 用原本模式從這張卡片續播
    };
}

// 🎯 移除「停止循環」跟隨鈕
function removeFollowStopBtn() {
    const btn = document.getElementById("followStopBtn");
    if (btn) btn.remove();
}

// 🎯 移除單張卡片的高亮
function removeHighlightCard(card) {
    if (card) {
        card.classList.remove("loop-highlight");
    }
}

</script>
